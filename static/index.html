<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SS EMPIRE PAYMENT GATEWAY - Instant UPI Checkout</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* ===== Premium Glow & Text Effects ===== */
    .gateway-title {
      text-shadow: 0 0 20px rgba(255, 23, 68, 0.6), 0 0 40px rgba(255, 23, 68, 0.3), 0 0 80px rgba(255, 23, 68, 0.15);
    }
    .gateway-title span {
      background: linear-gradient(135deg, #ff1744, #ff6b6b, #ff1744);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-size: 200% auto;
      animation: gradientShift 3s ease infinite;
      filter: drop-shadow(0 0 12px rgba(255, 23, 68, 0.5));
    }
    @keyframes gradientShift {
      0%, 100% { background-position: 0% center; }
      50% { background-position: 200% center; }
    }
    .brand-text h1 {
      text-shadow: 0 0 15px rgba(255, 23, 68, 0.5), 0 0 30px rgba(255, 23, 68, 0.2);
    }
    .gateway-subtitle {
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
    }
    .card-badge {
      box-shadow: 0 0 15px rgba(255, 23, 68, 0.2), inset 0 0 10px rgba(255, 23, 68, 0.05);
    }
    .btn-pay-hero {
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
    }
    .field-label {
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.08);
    }
    .trust-item span {
      text-shadow: 0 0 6px rgba(255, 255, 255, 0.06);
    }
    .gateway-card {
      box-shadow: 
        0 25px 60px -15px rgba(0, 0, 0, 0.9),
        0 0 80px -10px rgba(255, 23, 68, 0.18),
        0 0 120px -20px rgba(255, 23, 68, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.1) !important;
    }

    /* Ultra-Premium Hero Payment Card Styles */
    .hero-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 90px);
      padding: 30px 20px 60px;
      position: relative;
      z-index: 10;
    }

    .gateway-card {
      width: 100%;
      max-width: 490px;
      background: rgba(12, 16, 26, 0.85);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 23, 68, 0.28);
      border-radius: 24px;
      box-shadow: 
        0 25px 60px -15px rgba(0, 0, 0, 0.9),
        0 0 50px -10px rgba(255, 23, 68, 0.22),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      padding: 34px 30px;
      position: relative;
      overflow: hidden;
      animation: cardEntrance 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes cardEntrance {
      0% { opacity: 0; transform: translateY(24px) scale(0.97); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .card-top-glow {
      position: absolute;
      top: 0;
      left: 10%;
      right: 10%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #ff1744, #ff5252, #ff1744, transparent);
      box-shadow: 0 0 20px #ff1744;
    }

    .gateway-card-header {
      text-align: center;
      margin-bottom: 26px;
    }

    .card-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 14px;
      border-radius: 50px;
      background: rgba(255, 23, 68, 0.12);
      border: 1px solid rgba(255, 23, 68, 0.35);
      color: #ff5252;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .card-badge .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #00e676;
      box-shadow: 0 0 10px #00e676;
      animation: pulseGreen 1.8s infinite;
    }

    @keyframes pulseGreen {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.35); opacity: 0.7; }
    }

    .gateway-title {
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .gateway-title span {
      background: linear-gradient(135deg, #ff1744 0%, #ff5252 50%, #ff8a80 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .gateway-subtitle {
      font-size: 0.88rem;
      color: var(--text-secondary);
      font-weight: 400;
    }

    /* Big Amount Display & Input */
    .amount-input-box {
      background: rgba(6, 8, 14, 0.75);
      border: 2px solid rgba(255, 23, 68, 0.25);
      border-radius: 18px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.3s ease;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.5);
      margin-bottom: 16px;
    }

    .amount-input-box:focus-within {
      border-color: #ff1744;
      box-shadow: 0 0 25px rgba(255, 23, 68, 0.35), inset 0 2px 8px rgba(0, 0, 0, 0.5);
      background: rgba(10, 13, 22, 0.9);
    }

    .amount-symbol {
      font-size: 2.2rem;
      font-weight: 800;
      color: #ff1744;
      line-height: 1;
      user-select: none;
    }

    .amount-field {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      font-size: 2.2rem;
      font-weight: 800;
      font-family: 'JetBrains Mono', monospace;
      color: #ffffff;
      letter-spacing: -0.5px;
    }

    .amount-field::placeholder {
      color: rgba(255, 255, 255, 0.2);
    }

    /* Preset Quick Amount Chips */
    .amount-chips-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 22px;
    }

    .amount-chip {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 9px 4px;
      font-size: 0.88rem;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      text-align: center;
    }

    .amount-chip:hover {
      background: rgba(255, 23, 68, 0.12);
      border-color: rgba(255, 23, 68, 0.45);
      color: #ffffff;
      transform: translateY(-2px);
    }

    .amount-chip.active {
      background: linear-gradient(135deg, #ff1744, #d50000);
      border-color: #ff1744;
      color: #ffffff;
      box-shadow: 0 4px 18px rgba(255, 23, 68, 0.45);
      transform: translateY(-2px);
    }

    /* Purpose / Note input */
    .field-label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .note-input-box {
      background: rgba(6, 8, 14, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 12px 16px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.25s ease;
    }

    .note-input-box:focus-within {
      border-color: rgba(255, 23, 68, 0.6);
      background: rgba(10, 13, 22, 0.85);
      box-shadow: 0 0 16px rgba(255, 23, 68, 0.2);
    }

    .note-field {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      font-size: 0.92rem;
      color: #ffffff;
      font-family: 'Outfit', sans-serif;
    }

    .note-field::placeholder {
      color: var(--text-muted);
    }

    /* Big Glowing Pay Button */
    .btn-pay-hero {
      width: 100%;
      padding: 16px 24px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, #ff1744 0%, #ff5252 50%, #b71c1c 100%);
      color: #ffffff;
      font-size: 1.08rem;
      font-weight: 800;
      font-family: 'Outfit', sans-serif;
      letter-spacing: 0.4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 10px 35px rgba(255, 23, 68, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.25);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }

    .btn-pay-hero:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 45px rgba(255, 23, 68, 0.75), inset 0 1px 0 rgba(255, 255, 255, 0.35);
    }

    .btn-pay-hero:active {
      transform: translateY(0);
      box-shadow: 0 6px 20px rgba(255, 23, 68, 0.4);
    }

    .btn-pay-hero::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
      animation: buttonShimmer 3s infinite;
    }

    @keyframes buttonShimmer {
      0% { left: -100%; }
      50%, 100% { left: 100%; }
    }

    /* Supported Apps Banner */
    .apps-strip {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      text-align: center;
    }

    .apps-title {
      font-size: 0.76rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .apps-icons-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .app-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 50px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-secondary);
      transition: all 0.2s ease;
    }

    .app-pill:hover {
      background: rgba(255, 255, 255, 0.09);
      color: #ffffff;
      border-color: rgba(255, 23, 68, 0.35);
      transform: translateY(-1px);
    }

    .app-pill-icon {
      width: 18px;
      height: 18px;
      object-fit: contain;
      flex-shrink: 0;
      border-radius: 4px;
    }

    /* Trust Highlights */
    .trust-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 28px;
      width: 100%;
      max-width: 490px;
    }

    .trust-item {
      background: rgba(12, 16, 26, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 14px;
      padding: 12px 10px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .trust-item svg {
      color: #ff5252;
    }

    .trust-item span {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    /* Mobile Responsive Optimizations */
    @media (max-width: 600px) {
      .hero-container {
        padding: 20px 12px 95px;
      }
      .gateway-card {
        padding: 24px 16px;
        border-radius: 20px;
      }
      .gateway-title {
        font-size: 1.45rem;
      }
      .amount-input-box {
        padding: 12px 16px;
      }
      .amount-field, .amount-symbol {
        font-size: 1.75rem;
      }
      .amount-chips-grid {
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
      }
      .amount-chip {
        padding: 8px 2px;
        font-size: 0.76rem;
      }
      .btn-pay-hero {
        padding: 14px 18px;
        font-size: 1rem;
      }
      .apps-icons-row {
        gap: 8px;
      }
      .app-pill {
        padding: 5px 8px;
        font-size: 0.72rem;
      }
      .trust-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        margin-top: 18px;
      }
      .trust-item {
        padding: 10px 4px;
        border-radius: 10px;
      }
      .trust-item span {
        font-size: 0.65rem;
      }
      .navbar {
        padding: 12px 16px;
      }
      .brand-logo-img {
        width: 40px;
        height: 40px;
      }
      .brand-text h1 {
        font-size: 1.05rem;
      }
      .brand-text span {
        font-size: 0.65rem;
      }
    }
  </style>
</head>
<body>

  <!-- Video Background -->
  <div class="video-bg-container">
    <video autoplay muted loop playsinline class="video-bg">
      <source src="bg-2.mp4" type="video/mp4">
    </video>
    <div class="video-bg-overlay"></div>
  </div>

  <!-- Navbar -->
  <header class="navbar">
    <a href="/" class="brand">
      <img src="logo.png" alt="SS EMPIRE" class="brand-logo-img">
      <div class="brand-text">
        <h1>SS EMPIRE PAYMENT GATEWAY</h1>
        <span>Official UPI Merchant Portal</span>
      </div>
    </a>
  </header>

  <!-- Main Hero Payment Container -->
  <main class="hero-container">

    <div class="gateway-card">
      <div class="card-top-glow"></div>

      <div class="gateway-card-header">
        <div class="card-badge">
          <span class="pulse-dot"></span>
          Instant UPI Engine 2.0
        </div>
        <h2 class="gateway-title">Quick <span>Pay</span></h2>
        <p class="gateway-subtitle">Direct scan & pay with any UPI application</p>
      </div>

      <form id="checkoutForm">
        <!-- Customer Name & Mobile Details -->
        <div class="cust-details-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px;">
          <div>
            <label class="field-label" for="custName" style="margin-bottom: 6px;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              Your Name *
            </label>
            <div class="note-input-box" style="margin-bottom: 0;">
              <input 
                type="text" 
                id="custName" 
                class="note-field" 
                placeholder="e.g. Bunny Sharma" 
                required
              >
            </div>
          </div>
          <div>
            <label class="field-label" for="custMobile" style="margin-bottom: 6px;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
              Mobile / WhatsApp *
            </label>
            <div class="note-input-box" style="margin-bottom: 0;">
              <input 
                type="tel" 
                id="custMobile" 
                class="note-field" 
                placeholder="10-digit number" 
                maxlength="10" 
                pattern="[0-9]{10}"
                required
              >
            </div>
          </div>
        </div>

        <!-- Amount Input -->
        <label class="field-label" for="custAmount">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          Enter Amount (INR)
        </label>
        
        <div class="amount-input-box">
          <span class="amount-symbol">₹</span>
          <input 
            type="number" 
            id="custAmount" 
            class="amount-field" 
            min="1" 
            step="1" 
            value="100" 
            placeholder="0"
            required
            autocomplete="off"
          >
        </div>

        <!-- Preset Quick Amount Chips -->
        <div class="amount-chips-grid">
          <button type="button" class="amount-chip" data-val="1">₹1</button>
          <button type="button" class="amount-chip" data-val="10">₹10</button>
          <button type="button" class="amount-chip" data-val="50">₹50</button>
          <button type="button" class="amount-chip active" data-val="100">₹100</button>
          <button type="button" class="amount-chip" data-val="250">₹250</button>
          <button type="button" class="amount-chip" data-val="500">₹500</button>
          <button type="button" class="amount-chip" data-val="1000">₹1,000</button>
          <button type="button" class="amount-chip" data-val="2000">₹2,000</button>
        </div>

        <!-- Purpose / Remark (Optional) -->
        <label class="field-label" for="custRemark">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          Payment Note (Optional)
        </label>
        <div class="note-input-box">
          <input 
            type="text" 
            id="custRemark" 
            class="note-field" 
            placeholder="e.g. VIP Subscription, Order #123"
            value="Service Payment"
          >
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-pay-hero" id="btnPayNow">
          <span id="btnPayText">Pay ₹100 with UPI</span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </form>

      <!-- Supported Apps -->
      <div class="apps-strip">
        <div class="apps-title">Supported UPI Applications</div>
        <div class="apps-icons-row">
          <div class="app-pill">
            <img src="icon_gpay.svg" alt="Google Pay" class="app-pill-icon">
            <span>Google Pay</span>
          </div>
          <div class="app-pill">
            <img src="icon_phonepe.svg" alt="PhonePe" class="app-pill-icon">
            <span>PhonePe</span>
          </div>
          <div class="app-pill">
            <img src="icon_paytm_square.svg" alt="Paytm" class="app-pill-icon">
            <span>Paytm</span>
          </div>
          <div class="app-pill">
            <img src="icon_bhim_square.svg" alt="BHIM UPI" class="app-pill-icon">
            <span>BHIM UPI</span>
          </div>
        </div>
      </div>

    </div>

    <!-- Trust Highlights -->
    <div class="trust-grid">
      <div class="trust-item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <span>256-Bit SSL Encrypted</span>
      </div>
      <div class="trust-item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        <span>Instant Verification</span>
      </div>
      <div class="trust-item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 14 14"/></svg>
        <span>0% Additional Fee</span>
      </div>
    </div>

  </main>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="app.js"></script>
</body>
</html>

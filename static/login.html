<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SS EMPIRE - Admin Login</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #05070a;
      color: #fff;
      overflow: hidden;
      position: relative;
    }

    /* Video Background */
    .video-bg-container {
      position: fixed; top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: -2; overflow: hidden; pointer-events: none;
    }
    .video-bg {
      width: 100%; height: 100%;
      object-fit: cover;
      filter: brightness(0.4) contrast(1.2) saturate(1.3);
    }
    .video-bg-overlay {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      background:
        radial-gradient(circle at 50% 30%, rgba(255, 23, 68, 0.15) 0%, transparent 60%),
        linear-gradient(180deg, rgba(5, 7, 10, 0.7) 0%, rgba(5, 7, 10, 0.95) 100%);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    /* Login Card */
    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 48px 40px;
      background: rgba(14, 17, 26, 0.82);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 23, 68, 0.25);
      border-radius: 24px;
      box-shadow:
        0 30px 60px rgba(0, 0, 0, 0.85),
        0 0 60px rgba(255, 23, 68, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
      text-align: center;
      position: relative;
      z-index: 1;
      animation: fadeInUp 0.7s ease-out;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-logo {
      width: 80px; height: 80px;
      border-radius: 20px;
      margin: 0 auto 20px;
      display: block;
      box-shadow: 0 0 40px rgba(255, 23, 68, 0.6), 0 0 0 2px rgba(255, 23, 68, 0.4);
      border: 2px solid rgba(255, 23, 68, 0.5);
      object-fit: cover;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .login-logo:hover {
      transform: scale(1.08) rotate(-3deg);
    }

    .login-title {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.3px;
      background: linear-gradient(135deg, #fff 30%, #ff5252 80%, #ff1744 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }

    .login-subtitle {
      font-size: 0.82rem;
      color: #ff5252;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 600;
      margin-bottom: 32px;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 0.78rem;
      color: #94a3b8;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 600;
    }

    .form-group input {
      width: 100%;
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: #fff;
      font-size: 0.95rem;
      font-family: 'Outfit', sans-serif;
      outline: none;
      transition: all 0.3s ease;
    }

    .form-group input:focus {
      border-color: #ff1744;
      box-shadow: 0 0 20px rgba(255, 23, 68, 0.25), inset 0 0 0 1px rgba(255, 23, 68, 0.2);
      background: rgba(255, 23, 68, 0.04);
    }

    .form-group input::placeholder {
      color: #4a5568;
    }

    .login-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #ff1744 0%, #ff5252 50%, #b71c1c 100%);
      border: none;
      border-radius: 14px;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      font-family: 'Outfit', sans-serif;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: all 0.35s ease;
      box-shadow: 0 8px 25px rgba(255, 23, 68, 0.4);
      margin-top: 8px;
      position: relative;
      overflow: hidden;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 35px rgba(255, 23, 68, 0.55);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .error-msg {
      color: #ff5252;
      font-size: 0.82rem;
      margin-top: 14px;
      min-height: 20px;
      font-weight: 500;
      transition: opacity 0.3s;
    }

    .lock-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 0.72rem;
      color: #4a5568;
      margin-top: 28px;
      letter-spacing: 0.3px;
    }
    .lock-icon svg {
      width: 14px; height: 14px;
      stroke: #4a5568; fill: none; stroke-width: 2;
    }

    /* Floating particles */
    .particle {
      position: fixed;
      width: 3px; height: 3px;
      background: rgba(255, 23, 68, 0.35);
      border-radius: 50%;
      pointer-events: none;
      animation: float linear infinite;
    }
    @keyframes float {
      0% { transform: translateY(100vh) scale(0); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- Video Background -->
  <div class="video-bg-container">
    <video autoplay muted loop playsinline class="video-bg">
      <source src="bg.mp4" type="video/mp4">
    </video>
    <div class="video-bg-overlay"></div>
  </div>

  <!-- Floating Particles -->
  <script>
    for (let i = 0; i < 20; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + 'vw';
      p.style.animationDuration = (6 + Math.random() * 8) + 's';
      p.style.animationDelay = (Math.random() * 6) + 's';
      p.style.width = p.style.height = (2 + Math.random() * 3) + 'px';
      document.body.appendChild(p);
    }
  </script>

  <!-- Login Card -->
  <div class="login-card">
    <img src="logo.png" alt="SS EMPIRE" class="login-logo">
    <div class="login-title">SS EMPIRE</div>
    <div class="login-subtitle">Admin Panel Login</div>

    <form id="loginForm" onsubmit="return handleLogin(event)">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter admin username" autocomplete="username" required autofocus>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="login-btn" id="loginBtn">
        🔐 Login to Admin Panel
      </button>
      <div class="error-msg" id="errorMsg"></div>
    </form>

    <div class="lock-icon">
      <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      Protected Area • Authorized Access Only
    </div>
  </div>

  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const err = document.getElementById('errorMsg');
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();

      btn.disabled = true;
      btn.textContent = '⏳ Authenticating...';
      err.textContent = '';

      try {
        const resp = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: user, password: pass })
        });
        const data = await resp.json();
        if (data.success) {
          btn.textContent = '✅ Access Granted!';
          btn.style.background = 'linear-gradient(135deg, #00e676, #00c853)';
          btn.style.boxShadow = '0 8px 25px rgba(0, 230, 118, 0.4)';
          setTimeout(() => { window.location.href = '/admin'; }, 600);
        } else {
          err.textContent = '❌ ' + (data.message || 'Invalid credentials');
          btn.disabled = false;
          btn.textContent = '🔐 Login to Admin Panel';
          document.getElementById('password').value = '';
          document.getElementById('password').focus();
        }
      } catch (ex) {
        err.textContent = '⚠️ Connection error. Please try again.';
        btn.disabled = false;
        btn.textContent = '🔐 Login to Admin Panel';
      }
    }
  </script>

</body>
</html>
